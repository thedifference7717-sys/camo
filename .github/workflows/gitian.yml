name: ci/gh-actions/gitian

# CAMO: reproducible release builds. Runs on release tags (v*), by hand (Actions -> Run workflow), and on PRs that
# touch the build recipes. The repo is cloned from the runner's own checkout, so this works while the repo is private.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'contrib/depends/**'
      - 'contrib/gitian/**'
      - '!contrib/**.md'
      - '.github/workflows/gitian.yml'
  pull_request:
    paths:
      - 'contrib/depends/**'
      - 'contrib/gitian/**'
      - '!contrib/**.md'
      - '.github/workflows/gitian.yml'

# A newer push/PR update cancels the older run still in progress on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gitian:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          - name: "Linux"
            option: "l"
          - name: "Windows"
            option: "w"
          - name: "macOS"
            option: "m"
    name: ${{ matrix.operating-system.name }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
    - name: prepare
      run: |
        sudo apt update
        cp contrib/gitian/gitian-build.py .
        chmod +x gitian-build.py
    - name: set env
      run: |
        if [ "${{ github.ref_type }}" != "tag" ]; then
          # build exactly the commit this run checked out (for a PR: the merge commit)
          echo "GITIAN_VERSION=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GITIAN_OUTDIR=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GITIAN_EXTRA_FLAGS=--commit" >> $GITHUB_ENV
        else
          echo "GITIAN_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "GITIAN_OUTDIR=${{ github.ref_name }}" >> $GITHUB_ENV
        fi
    - name: setup
      run: |
        ./gitian-build.py --setup --docker --url ${{ github.workspace }} ${{ env.GITIAN_EXTRA_FLAGS }} github-actions ${{ env.GITIAN_VERSION }}
    - name: build
      run: |
        ./gitian-build.py --docker --url ${{ github.workspace }} --detach-sign --no-commit --build -j 4 -o ${{ matrix.operating-system.option }} ${{ env.GITIAN_EXTRA_FLAGS }} github-actions ${{ env.GITIAN_VERSION }}
    - name: post build
      run: |
        cd out/${{ env.GITIAN_OUTDIR }}
        shasum -a256 *
        echo \`\`\` >> $GITHUB_STEP_SUMMARY
        shasum -a256 * >> $GITHUB_STEP_SUMMARY
        echo \`\`\` >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      with:
        name: camo-gitian-${{ matrix.operating-system.name }}-${{ env.GITIAN_OUTDIR }}
        path: |
          out/${{ env.GITIAN_OUTDIR }}/*
